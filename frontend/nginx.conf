# frontend/nginx.conf
server {
    listen 80;
    server_name localhost;

    # 1. Servir el Frontend (React + Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy para la API de Riesgo
    location /api/v1/riesgo {
        proxy_pass http://api-riesgo:8000/api/v1/riesgo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Proxy para la API de Datos (Variables y CSV)
    location /api/v1/variables {
        proxy_pass http://api-datos:8001/api/v1/variables;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/csv {
        proxy_pass http://api-datos:8001/api/v1/csv;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Importante: Aumentar el límite para permitir tu CSV de 5MB
        client_max_body_size 6M; 
    }
}